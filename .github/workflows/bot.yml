name: NESTS Monitor

on:
  schedule:
    - cron: '*/2 * * * *'  # every 2 mins UTC
    - cron: '1-59/2 * * * *'  # offset 1 min for more reliability
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send test telegram message'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches: [main]

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      
      - name: Test Telegram (if selected)
        if: ${{ inputs.test_mode == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --test

      - name: Run bot scan
        if: ${{ inputs.test_mode != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
